[project]
name = "aurorae-images"
version = "0.1.0"
description = "Image upload and classification API built with FastAPI and ONNX Runtime"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "pydantic-settings>=2.6",
    "pillow>=11.0",
    "numpy>=2.1",
    "onnxruntime>=1.20",
    "pyyaml>=6.0.3",
    "tokenizers>=0.23.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # Starlette >= 1.0 TestClient imports httpx2 (pydantic/httpx2, by the httpx author);
    # plain httpx still works but is deprecated there.
    "httpx2>=2.13",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "nltk>=3.10.3",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurorae_images"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/build_eval_manifest.py" = ["E501"]  # REVIEW is keyed by full Commons file titles

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=aurorae_images --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
