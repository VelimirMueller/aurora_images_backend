name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Cache model
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch_model.py') }}
      - run: uv run python scripts/fetch_model.py
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Cache eval images
        uses: actions/cache@v4
        with:
          path: eval/images
          key: eval-images-${{ hashFiles('eval/manifest.yaml') }}
      - name: Eval gate (SigLIP root-topic accuracy >= 90 %)
        run: |
          set -o pipefail  # default `bash -e` has no pipefail: tee would hide a failing gate
          uv run python scripts/evaluate.py --min-topic-accuracy 0.9 | tee eval-report.md
          cat eval-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg BACKEND=mobilenet -t aurora-images:ci .
      - name: Smoke test container
        run: |
          docker run -d --rm --name api -p 8000:8000 aurora-images:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
