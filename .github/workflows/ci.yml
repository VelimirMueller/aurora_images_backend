name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Cache model
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch_model.py') }}
      - run: uv run python scripts/fetch_model.py
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg BACKEND=mobilenet -t aurora-images:ci .
      - name: Smoke test container
        run: |
          docker run -d --rm --name api -p 8000:8000 aurora-images:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
